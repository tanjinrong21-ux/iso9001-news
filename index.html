<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISO 9001 标准更新追踪</title>
<style>
  :root {
    --tuv-blue: #003366;
    --tuv-light: #004d99;
    --tuv-accent: #0099cc;
    --bg: #f4f6f9;
    --card-bg: #ffffff;
    --text: #1a1a2e;
    --text-secondary: #5a6070;
    --border: #e0e4ea;
    --tag-bg: #e8f4f8;
    --tag-text: #006080;
    --fresh: #e63946;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  header {
    background: linear-gradient(135deg, var(--tuv-blue) 0%, #002244 100%);
    color: #fff;
    padding: 2rem 1rem 1.5rem;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,.15);
  }
  header h1 {
    font-size: 1.6rem;
    font-weight: 700;
    letter-spacing: .02em;
  }
  header .subtitle {
    font-size: .85rem;
    opacity: .75;
    margin-top: .25rem;
  }
  header .update-time {
    font-size: .75rem;
    opacity: .55;
    margin-top: .5rem;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 1rem;
  }
  .stats-bar {
    display: flex;
    gap: .75rem;
    margin: 1rem 0;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card-bg);
    border-radius: 8px;
    padding: .6rem 1rem;
    font-size: .82rem;
    color: var(--text-secondary);
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    display: flex;
    align-items: center;
    gap: .35rem;
  }
  .stat .num {
    font-weight: 700;
    color: var(--tuv-blue);
    font-size: 1.1rem;
  }
  .stat .new-badge {
    background: var(--fresh);
    color: #fff;
    font-size: .65rem;
    padding: 1px 6px;
    border-radius: 10px;
    font-weight: 600;
  }
  .filter-row {
    display: flex;
    gap: .5rem;
    margin-bottom: 1rem;
    flex-wrap: wrap;
  }
  .filter-tag {
    font-size: .78rem;
    padding: .3rem .75rem;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: #fff;
    cursor: pointer;
    transition: all .2s;
    user-select: none;
  }
  .filter-tag:hover { border-color: var(--tuv-accent); color: var(--tuv-accent); }
  .filter-tag.active {
    background: var(--tuv-blue);
    color: #fff;
    border-color: var(--tuv-blue);
  }
  .news-list { display: flex; flex-direction: column; gap: .75rem; }
  .news-card {
    background: var(--card-bg);
    border-radius: 10px;
    padding: 1rem 1.2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,.06);
    transition: transform .15s, box-shadow .15s;
    border-left: 4px solid transparent;
    cursor: pointer;
    position: relative;
  }
  .news-card:hover {
    transform: translateY(-1px);
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
  }
  .news-card.new { border-left-color: var(--fresh); }
  .news-card .source-tag {
    display: inline-block;
    font-size: .7rem;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 12px;
    background: var(--tag-bg);
    color: var(--tag-text);
    margin-bottom: .4rem;
  }
  .news-card .date {
    font-size: .78rem;
    color: var(--text-secondary);
    float: right;
  }
  .news-card h3 {
    font-size: 1rem;
    font-weight: 600;
    margin: .3rem 0;
    line-height: 1.4;
    color: var(--tuv-blue);
  }
  .news-card .summary {
    font-size: .85rem;
    color: var(--text-secondary);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .news-card .read-more {
    font-size: .78rem;
    color: var(--tuv-accent);
    margin-top: .4rem;
    display: inline-block;
  }
  .news-card a {
    text-decoration: none;
    color: inherit;
  }
  .empty {
    text-align: center;
    padding: 3rem 1rem;
    color: var(--text-secondary);
    font-size: .9rem;
  }
  footer {
    text-align: center;
    padding: 2rem 1rem;
    font-size: .75rem;
    color: #999;
  }
  @media (max-width: 600px) {
    header h1 { font-size: 1.3rem; }
    .news-card { padding: .8rem 1rem; }
    .news-card h3 { font-size: .92rem; }
  }
</style>
</head>
<body>

<header>
  <h1>ISO 9001 标准更新追踪</h1>
  <div class="subtitle">追踪 ISO 9001 修订动态 · 行业解读 · 过渡指南</div>
  <div class="update-time" id="updateTime">最后更新：加载中...</div>
</header>

<div class="container">
  <div class="stats-bar">
    <div class="stat">📰 <span class="num" id="totalCount">-</span> 条消息</div>
    <div class="stat">🆕 <span class="num" id="newCount">-</span> <span class="new-badge">本周新增</span></div>
    <div class="stat">🗓 覆盖近 <span class="num" id="monthCount">-</span> 天</div>
  </div>

  <div class="filter-row" id="filterRow">
    <span class="filter-tag active" data-filter="all">全部</span>
    <span class="filter-tag" data-filter="revision">标准修订</span>
    <span class="filter-tag" data-filter="transition">过渡指南</span>
    <span class="filter-tag" data-filter="analysis">行业解读</span>
    <span class="filter-tag" data-filter="official">官方动态</span>
    <span class="filter-tag" data-filter="cn">中文资讯</span>
  </div>

  <div class="news-list" id="newsList"></div>
  <div class="empty" id="emptyMsg" style="display:none">暂无匹配的新闻</div>
</div>

<footer>
  <p>数据来源：ISO.org · SGS · DNV · Intertek · Quality Magazine · 认证机构公告</p>
  <p>每日 9:00 自动更新 · Powered by Hermes AI Agent</p>
</footer>

前完成 SCC 的过渡决定（含认可文件/证书签发）；此后仅受理 2026 版申请；所有现行认证须转换为 2026 版。", "date": "2026-09-25", "tags": ["official", "transition"]}, {"source": "ISO/TC 176", "url": "https://committee.iso.org/sites/tc176/home/news/content-left-area/news-and-updates/news.html", "title": "ISO/TC 176 官方公告：ISO 9001:2026 已发布 — 附完整过渡时间表", "summary": "ISO/TC 176 于 2026-09-23 由 Mark Finewood 发布公告确认 ISO 9001:2026 已于 2026-09-16 出版，并给出经 Global ACI 确认的过渡关键节点：认可机构最迟 2027-03-31 具备对 ISO 9001:2026 实施评审的能力；获认可的认证机构须在 2027-06-30 前提交过渡声明及支持性信息；认可机构的过渡决定须在 2027-09-30 前完成；自 2028-03-31 起，新的和初次认可认证只能依据 ISO 9001:2026 颁发；已获 ISO 9001:2015 认证的组织须在 2029-09-30 前完成过渡。变化要点：措辞更清晰，更强调领导力、质量文化与责任担当，风险与机遇表述更明确，新增附录 A 澄清关键术语与条款意图，并与其他管理体系标准保持更好对齐。", "date": "2026-09-23", "tags": ["official", "transition"]}, {"source": "ANSI", "url": "https://www.ansi.org/standards-news/all-news/9-16-26-first-full-revision-of-iso-9001-in-a-decade-now-available-from-ansi", "title": "ANSI：十年来首次全面修订 — ISO 9001:2026 已可通过 ANSI 网络书店获取", "summary": "美国国家标准机构 ANSI 于 2026-09-16 发文称 ISO 9001:2026 是这一全球应用最广质量管理标准十余年来首次全面修订，并概括六项更新：风险与机遇的区分更清晰，鼓励组织像防范挫折一样主动寻找改进机会；更强调质量文化、价值观与道德行为，明确领导层在营造质量环境中的角色；更重视变更管理，帮助组织有意识地而非被动应对转变；气候变化内容并入正文（吸收 2015 版 2024 修正案）；修订附录 A 阐释要求意图以降低歧义误读，对首次使用者与小微企业尤其友好；通过最新协调结构加强与其他管理体系标准对齐，使整合体系运行更高效。ANSI 总裁 Laurie E. Locascio 表示信任不是宣称出来的，而是通过开放、平衡与共识建立的。文中提示：认证机构须先由认可机构完成自身过渡，才能颁发新版证书，组织应尽早与认证机构排定过渡审核。", "date": "2026-09-16", "tags": ["official", "analysis"]}, {"source": "Smithers", "url": "https://www.smithers.com/resources/2026/september/iso-9001-2026-is-here-what-your-business-must-know", "title": "Smithers：ISO 9001:2026 已生效 — 审核关注点与过渡实操要点", "summary": "Smithers 于 2026 年 9 月发布的实务解读，站在审核视角拆解新版变化：一是质量文化与道德要求升级，领导层须证明质量价值观已嵌入全业务而非局限于质量部门，质量从合规职能回归全员共担；二是风险与机遇管理更严格，简单的风险登记表已不够，组织需有分析、排序与行动计划，以改善决策并激发真正的创新机会；三是变更管理要求收紧，凡可能影响质量绩效的重大变更，都须能证明策划、沟通、监测与评审有效；四是气候变化考量直接纳入标准正文，组织须评估气候议题与其业务环境、相关方及质量目标的相关性。文章同时引用 NSF 技术方案经理 Marco Brunato 的观点：新版与 ISO 协调结构一致，同时回应组织韧性、道德行为、知识管理与气候议题等当代挑战。审核仍以有效性为核心，而非文件化程度。", "date": "2026-09-16", "tags": ["analysis", "transition"]}, {"source": "Global ACI", "url": "https://global-aci.org/en/news/global-aci-publishes-transition-requirements-for-iso-90012026", "title": "Global ACI 正式发布 ISO 9001:2026 过渡要求 — 强制性文件 TECH-3-TR 2029-09-30 (M)", "summary": "原 IAF 职能承接方 Global ACI（国际认可合作组织）已发布强制性文件 Global ACI-TECH-3-TR 2029-09-30 (M)《Transition Requirements for ISO 9001:2026》，签发日 2026-09-04、实施日 2026-09-16，为认可机构与获认可认证机构提供从 ISO 9001:2015（含 Amd 1:2024）向新版过渡的时间表，对 Global ACI MRA 签署方及其认可认证机构具强制性。核心期限：认可机构最迟 2027-03-31 具备评审能力；认证机构 2027-06-30 前提交过渡声明；认可机构过渡决定 2027-09-30 前完成；2028-03-31 起新发/初次认可认证仅限 ISO 9001:2026；现有 2015 版获证组织最迟 2029-09-30 完成过渡，可在例行监督或再认证审核中完成，也可另做专项过渡审核。全球逾百万张获认可 ISO 9001 证书需在此统一时间框架下完成转换。", "date": "2026-09-16", "tags": ["official", "transition"]}, {"source": "ISO", "url": "https://www.iso.org/news/2026/09/ISO9001-2026", "title": "ISO 9001:2026 正式发布 — 全球最广泛应用质量管理标准迎来第六版", "summary": "ISO 于 2026 年 9 月 16 日在日内瓦宣布 ISO 9001:2026《质量管理体系 — 要求》正式发布，取代 ISO 9001:2015。新版更强调领导力、质量文化与道德行为，对风险和机遇的考虑给出更清晰的说明，采用最新协调结构（HS）以便与其他管理体系整合，并新增附录 A 阐释条款意图。ISO 秘书长 Sergio Mujica 称其为质量管理「黄金标准」的里程碑。ISO 9001 还将纳入 ISO 首批数字化增强内容，自 2026 年 10 月 1 日起提供。", "date": "2026-09-16", "tags": ["official", "revision"]}, {"source": "ISO", "url": "https://www.iso.org/standard/88464.html", "title": "ISO 9001:2026（第 6 版）标准页面 — 修订全生命周期节点可查", "summary": "ISO 官网 ISO 9001 页面显示第 6 版（Edition 6，2026-09），将取代 ISO 9001:2015。关键节点：DIS 注册 2025-06-30、DIS 投票启动 2025-08-27、投票结束 2025-11-20、DIS 获批转 FDIS 2026-04-15、FDIS 投票启动 2026-05-14、投票结束 2026-07-10、进入出版阶段（60.00）。提示：截至 2026-09-22 查询时该页面仍显示「出版中 · 最终制作步骤（最长约七周）」，最终出版阶段 60.60 待 ISO 更新。", "date": "2026-09-16", "tags": ["official"]}, {"source": "ISO", "url": "https://www.iso.org/quality-management/iso-9001-2026", "title": "ISO 官方解读：ISO 9001:2026 要点须知 — 变化、不变与过渡安排", "summary": "ISO 官方说明新版已成为现行版本并取代 2015 版，条款结构维持协调结构不变。重点变化：第 6.1 条更清晰区分风险与机遇；第 7.3 条新增对质量文化与道德行为的意识要求；新增附录 A 澄清关键概念、术语与条款意图。获证组织有三年过渡期，无需重新走一遍认证流程，具体时间由认证机构沟通。ISO 建议先做差距分析，再更新过程与成文信息，并让各层级人员理解变化。", "date": "2026-09-16", "tags": ["official", "analysis", "transition"]}, {"source": "ISO/TC 176/SC 2", "url": "https://committee.iso.org/sites/tc176sc2/home/news/content-left-area/news-and-updates/news-1.html", "title": "ISO/FDIS 9001 以压倒性国际支持获批 — 确认 9 月 16 日出版", "summary": "ISO/TC 176/SC 2 于 2026-08-07 公告：ISO/FDIS 9001 获得压倒性国际支持通过，第六版 ISO 9001 计划于 2026-09-16 出版，并向 WG 29 召集人、支持团队及全体成员为这一全球质量管理界里程碑所作的贡献致谢。", "date": "2026-08-07", "tags": ["official", "revision"]}, {"source": "NSF", "url": "https://www.nsf.org/knowledge-library/iso-90012026-published-on-september-16-2026-what-quality-leaders-need-to-know", "title": "NSF：ISO 9001:2026 将于 9 月 16 日发布 — 质量负责人须知", "summary": "NSF 技术方案经理 Marco Brunato 撰文：ISO 已公布 ISO 9001:2026 于 2026-09-16（周三）发布。新版是演进而非革命，体系成熟的组织无需大改；重点强化质量文化、道德行为、风险管理、组织知识与气候相关考虑。2015 版获证组织预计有约三年过渡期，可结合既有认证周期完成转换，提早规划者过渡更顺、受益更快。", "date": "2026-08-07", "tags": ["analysis", "transition"]}, {"source": "9001Simplified", "url": "https://www.9001simplified.com/learn/next-iso-9001-revision.php", "title": "ISO 9001:2026 修订完整时间线 — DIS 批准至 FDIS 发布", "summary": "ISO 9001:2026 修订进入最后阶段。DIS 于 2025 年 8 月发布并以 97% 支持率通过，2026 年 2 月墨西哥城会议达成技术共识，FDIS 于 2026 年 7 月获批，正式版预计 2026 年 9 月发布。3 年过渡期同步开启。", "date": "2026-07-15", "tags": ["revision", "official"]}, {"source": "标准知多点 / 江苏省钢铁行业协会", "url": "http://www.jsgt.org.cn/index.php/Home/Index/art/a_id/38532.html", "title": "国家标准《质量管理体系 要求》启动修订 — 拟等同采用 ISO 9001:2026（中文）", "summary": "市场监管总局标准技术管理司就 153 项拟立项国家标准征求意见，其中《质量管理体系 要求》拟修订，等同采用 ISO 9001:2026，代替现行 GB/T 19001-2016。该标准由 TC151（全国质量管理和质量保证标准化技术委员会）归口，国家标准委主管，中国标准化研究院牵头起草，项目周期 10 个月，意见征集截止 2026-08-06。中文要点：强化最高管理者牵头落实道德与诚信，新增质量文化建设内容，更关注气候变化因素，风险与机遇拆分为两个独立条款，附录新增新兴技术管控内容，并以「可获得」取代「保持 / 保留」的成文信息表述。", "date": "2026-07-10", "tags": ["cn", "revision"]}, {"source": "IAF", "url": "https://iaf.nu/", "title": "IAF 预期发布 ISO 9001:2026 过渡安排指南", "summary": "国际认可论坛（IAF）将在 ISO 9001:2026 正式发布后公布过渡安排。业界预期过渡期为 3 年（至 2029 年 9 月），与以往主要修订的过渡政策保持一致。", "date": "2026-07-01", "tags": ["official", "transition"]}, {"source": "ISTO", "url": "https://www.isto.ch/pt/insights/iso9001-2026-changes", "title": "ISO 9001:2026 变化解析：质量文化、气候变化与扩展的附录 A", "summary": "ISTO 于 2026-06-22 发布的解读：发布日为 2026-09-16，三年过渡期预计至 2029 年 9 月，正式时长待认可机构确认。值得注意的组织变更：IAF 职能自 2026-01-01 起由 Global Accreditation Cooperation Incorporated（Global ACI）承接，过渡期的正式安排将由该机构公布。2015 版证书在整个过渡期内持续有效，企业因此有真正的时机选择空间。", "date": "2026-06-22", "tags": ["analysis", "transition"]}, {"source": "SGS", "url": "https://www.sgs.com/en/showcases/iso-9001-2026-key-updates-and-transition-guidance", "title": "ISO 9001:2026 关键更新与过渡指南 — SGS 官方解读", "summary": "新版维持 Annex SL 结构，融入质量文化和道德行为要求。FDIS 已于 2026 年 5 月发布，正式版 9 月发布，过渡期至 2029 年 9 月。建议组织尽早开始差距分析。", "date": "2026-06-15", "tags": ["transition", "official"]}, {"source": "ISO", "url": "https://www.iso.org/standard/62085.html", "title": "ISO 9001:2015 现行标准页面 — ISO 官方", "summary": "ISO 9001:2015 现行版本。ISO/TC 176/SC 2 正在推进 2026 版修订，新版预计 2026 年 9 月发布。全球应用最广泛的质量管理体系标准，超过 100 万组织获认证。", "date": "2026-06-01", "tags": ["official"]}, {"source": "Intertek", "url": "https://www.intertek.com/assurance/iso-9001/iso-9001-2026-key-updates-transition-guidance", "title": "ISO 9001:2026 关键更新与过渡指南 — Intertek 解读", "summary": "新版强调数字化与智能系统（AI、数据分析、自动化）、风险与供应链监督、伦理与组织治理、以及与 ESG 期望的对齐。预计 2026 年 9 月发布，约 3 年过渡期。", "date": "2026-05-10", "tags": ["analysis", "transition"]}, {"source": "Quality Magazine", "url": "https://www.qualitymag.com/articles/99324-iso-9001-in-2026-whats-changingand-how-as9100-ia9100-iatf-16949-nist-and-cmmc-fit-together", "title": "ISO 9001:2026 与 AS9100/IA9100、IATF 16949 的联动变化", "summary": "2026 年将迎来质量与合规标准的重大交汇。AS9100 将更名为 IA9100 并与 ISO 9001:2026 同步；IATF 16949 也在现代化更新。美国国防供应商面临 NIST 和 CMMC 的额外要求。", "date": "2026-04-05", "tags": ["analysis", "revision"]}, {"source": "DNV", "url": "https://www.dnv.us/assurance/Management-Systems/new-iso/transition/iso-9001-revision", "title": "ISO 9001:2026 修订：变化内容与过渡规划 — DNV 指南", "summary": "DNV 预计新版于 2026 年秋季发布。DIS 阶段于 2025 年 8 月底完成，各国成员体提交意见后工作组在 2026 年初进行处置。新版在风险管理、组织知识和变革管理方面有显著调整。", "date": "2026-03-20", "tags": ["revision", "transition"]}, {"source": "Smithers", "url": "https://www.smithers.com/resources/2026/january/iso-9001-news-preparing-for-the-2026-revision", "title": "ISO 9001 新闻：2026 修订准备与气候变化修正案", "summary": "2026 修订将强化协调结构（HS）以确保跨标准术语一致性，对整合管理体系（IMS）是利好。2024 年 2 月的气候行动修正案（Amd 1:2024）已立即生效，无需过渡期。", "date": "2026-01-25", "tags": ["revision", "analysis"]}, {"source": "Core Business Solutions", "url": "https://www.thecoresolution.com/iso-9001-2026-revision-explained", "title": "ISO 9001:2026 修订深度解读 — 伦理与诚信、数字化、供应链韧性", "summary": "新版 ISO 9001 将整合伦理与诚信到领导力实践，强化风险管理与供应链韧性，增加可持续性和社会责任的明确要求。核心结构保持 HS（协调结构），与 ISO/IEC 27001:2022 对齐。", "date": "2025-12-10", "tags": ["analysis", "revision"]}, {"source": "ISO 27001 中文网", "url": "http://www.iso27001.org.cn/fuwu/iso/iso9001/show_988.html", "title": "ISO 9001:2026 版标准的重要内容和变化（中文）", "summary": "11 项关键变化：道德与诚信、使命愿景价值观和质量文化、气候变化、风险与机遇概念更新、新兴技术（AI/元宇宙/VR/聊天机器人）、成文信息可获得性、QA 角色提升、相关方沟通、顾客体验扩展、服务与产品区别。", "date": "2024-12-10", "tags": ["cn", "revision"]}];

const UPDATE_TIME = "2026-10-29 13:02 CST";

(function() {
  var newsList = document.getElementById('newsList');
  var emptyMsg = document.getElementById('emptyMsg');
  var updateTime = document.getElementById('updateTime');

  updateTime.textContent = '最后更新：' + UPDATE_TIME;

  var activeFilter = 'all';

  function render(filter) {
    activeFilter = filter || activeFilter;
    var items = NEWS_DATA;
    if (activeFilter !== 'all') {
      items = items.filter(function(n) { return n.tags && n.tags.indexOf(activeFilter) >= 0; });
    }
    if (items.length === 0) {
      newsList.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';

    var now = Date.now();
    var weekAgo = now - 7 * 24 * 60 * 60 * 1000;

    var html = '';
    for (var i = 0; i < items.length; i++) {
      var n = items[i];
      var isNew = new Date(n.date).getTime() > weekAgo;
      var cls = isNew ? 'news-card new' : 'news-card';
      html += '<div class="' + cls + '" onclick="window.open(\'' + n.url + '\', \'_blank\')">';
      html += '<span class="source-tag">' + n.source + '</span>';
      html += '<span class="date">' + n.date + '</span>';
      html += '<h3>' + n.title + '</h3>';
      html += '<div class="summary">' + n.summary + '</div>';
      html += '<span class="read-more">阅读原文 →</span>';
      html += '</div>';
    }
    newsList.innerHTML = html;

    // stats
    document.getElementById('totalCount').textContent = NEWS_DATA.length;
    document.getElementById('newCount').textContent = NEWS_DATA.filter(function(n) {
      return new Date(n.date).getTime() > weekAgo;
    }).length;
    var dates = NEWS_DATA.map(function(n) { return new Date(n.date).getTime(); });
    if (dates.length > 0) {
      var range = Math.ceil((now - Math.min.apply(null, dates)) / (24 * 60 * 60 * 1000));
      document.getElementById('monthCount').textContent = range;
    }
  }

  document.getElementById('filterRow').addEventListener('click', function(e) {
    if (e.target.classList.contains('filter-tag')) {
      var tags = document.querySelectorAll('.filter-tag');
      for (var j = 0; j < tags.length; j++) tags[j].classList.remove('active');
      e.target.classList.add('active');
      render(e.target.dataset.filter);
    }
  });

  render();
})();
</script>
